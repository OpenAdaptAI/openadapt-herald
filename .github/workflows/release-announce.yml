name: weekly-digest

# Publishes weekly digest and on-demand announcements to Discord.
#
# Required secrets:
#   HERALD_ANTHROPIC_API_KEY   - Anthropic API key for LLM content generation
#   HERALD_DISCORD_WEBHOOK_URL - Discord webhook URL for posting
#
# Optional secrets:
#   HERALD_TWITTER_CONSUMER_KEY, HERALD_TWITTER_CONSUMER_SECRET,
#   HERALD_TWITTER_ACCESS_TOKEN, HERALD_TWITTER_ACCESS_TOKEN_SECRET
#   HERALD_LINKEDIN_ACCESS_TOKEN
#
# Optional repository variable:
#   HERALD_DEFAULT_MODEL       - Claude model for drafting. Unset uses herald's default.

on:
  # Weekly digest every Monday at 3pm UTC
  schedule:
    - cron: "0 15 * * 1"

  workflow_dispatch:
    inputs:
      content_type:
        description: "Content type"
        required: false
        default: "digest"
        type: choice
        options:
          - digest
          - release
          - spotlight
      days:
        description: "Look back N days"
        required: false
        default: "7"
        type: string
      dry_run:
        description: "Dry run (preview only)"
        required: false
        default: false
        type: boolean

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install herald from repo
        run: uv pip install --system .

      - name: Determine content type
        id: params
        # Inputs reach the shell as quoted environment variables, never as
        # script text, so a crafted `days` value can't run commands.
        env:
          INPUT_CONTENT_TYPE: ${{ inputs.content_type }}
          INPUT_DAYS: ${{ inputs.days }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            type=digest
            days=7
          else
            type="$INPUT_CONTENT_TYPE"
            days="$INPUT_DAYS"
          fi
          case "$type" in
            digest|release|spotlight) ;;
            *) echo "::error::content_type must be digest, release or spotlight."; exit 1 ;;
          esac
          case "$days" in
            ''|*[!0-9]*) echo "::error::days must be a whole number, such as 7."; exit 1 ;;
          esac
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"

      - name: Publish announcements
        env:
          HERALD_ANTHROPIC_API_KEY: ${{ secrets.HERALD_ANTHROPIC_API_KEY }}
          HERALD_DISCORD_WEBHOOK_URL: ${{ secrets.HERALD_DISCORD_WEBHOOK_URL }}
          HERALD_TWITTER_CONSUMER_KEY: ${{ secrets.HERALD_TWITTER_CONSUMER_KEY }}
          HERALD_TWITTER_CONSUMER_SECRET: ${{ secrets.HERALD_TWITTER_CONSUMER_SECRET }}
          HERALD_TWITTER_ACCESS_TOKEN: ${{ secrets.HERALD_TWITTER_ACCESS_TOKEN }}
          HERALD_TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.HERALD_TWITTER_ACCESS_TOKEN_SECRET }}
          HERALD_LINKEDIN_ACCESS_TOKEN: ${{ secrets.HERALD_LINKEDIN_ACCESS_TOKEN }}
          HERALD_REPOS: "OpenAdaptAI/OpenAdapt,OpenAdaptAI/openadapt-evals,OpenAdaptAI/openadapt-ml"
          HERALD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty when the variable isn't set, and herald then uses its default.
          HERALD_DEFAULT_MODEL: ${{ vars.HERALD_DEFAULT_MODEL }}
          # inputs.dry_run is a boolean, so use it directly. Comparing it with the
          # string 'true' is always false. Scheduled runs have no inputs, so this is 'false'.
          HERALD_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
          CONTENT_TYPE: ${{ steps.params.outputs.type }}
          DAYS: ${{ steps.params.outputs.days }}
        run: |
          herald publish \
            --content-type "$CONTENT_TYPE" \
            --days "$DAYS" \
            --embed-title "Weekly Digest" \
            ${DRY_RUN_FLAG:+"$DRY_RUN_FLAG"}
