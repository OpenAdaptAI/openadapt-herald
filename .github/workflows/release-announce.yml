name: weekly-digest

# Publishes weekly digest and on-demand announcements to Discord.
#
# Required secrets:
#   HERALD_ANTHROPIC_API_KEY   - Anthropic API key for LLM content generation
#   HERALD_DISCORD_WEBHOOK_URL - Discord webhook URL for posting
#
# Optional secrets:
#   HERALD_TWITTER_CONSUMER_KEY, HERALD_TWITTER_CONSUMER_SECRET,
#   HERALD_TWITTER_ACCESS_TOKEN, HERALD_TWITTER_ACCESS_TOKEN_SECRET
#   HERALD_LINKEDIN_ACCESS_TOKEN

on:
  # Weekly digest every Monday at 3pm UTC
  schedule:
    - cron: "0 15 * * 1"

  workflow_dispatch:
    inputs:
      content_type:
        description: "Content type"
        required: false
        default: "digest"
        type: choice
        options:
          - digest
          - release
          - spotlight
      days:
        description: "Look back N days"
        required: false
        default: "7"
        type: string
      dry_run:
        description: "Dry run (preview only)"
        required: false
        default: false
        type: boolean

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install herald from repo
        run: uv pip install --system .

      - name: Determine content type
        id: params
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "type=digest" >> $GITHUB_OUTPUT
            echo "days=7" >> $GITHUB_OUTPUT
          else
            echo "type=${{ inputs.content_type }}" >> $GITHUB_OUTPUT
            echo "days=${{ inputs.days }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish announcements
        env:
          HERALD_ANTHROPIC_API_KEY: ${{ secrets.HERALD_ANTHROPIC_API_KEY }}
          HERALD_DISCORD_WEBHOOK_URL: ${{ secrets.HERALD_DISCORD_WEBHOOK_URL }}
          HERALD_TWITTER_CONSUMER_KEY: ${{ secrets.HERALD_TWITTER_CONSUMER_KEY }}
          HERALD_TWITTER_CONSUMER_SECRET: ${{ secrets.HERALD_TWITTER_CONSUMER_SECRET }}
          HERALD_TWITTER_ACCESS_TOKEN: ${{ secrets.HERALD_TWITTER_ACCESS_TOKEN }}
          HERALD_TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.HERALD_TWITTER_ACCESS_TOKEN_SECRET }}
          HERALD_LINKEDIN_ACCESS_TOKEN: ${{ secrets.HERALD_LINKEDIN_ACCESS_TOKEN }}
          HERALD_REPOS: "OpenAdaptAI/OpenAdapt,OpenAdaptAI/openadapt-evals,OpenAdaptAI/openadapt-ml"
          HERALD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          herald publish \
            --content-type ${{ steps.params.outputs.type }} \
            --days ${{ steps.params.outputs.days }} \
            --embed-title "Weekly Digest" \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
